name: Scrape Motorcycle Data

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 11:00 CST (UTC+8)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        run: npm install
        working-directory: scraper

      - name: Run scraper
        run: node index.js
        working-directory: scraper

      - name: Validate scraped data
        run: |
          FILE="public/data/motorcycles.json"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: Data file not found"
            exit 1
          fi
          COUNT=$(node -e "const d=require('./$FILE'); console.log(d.data.length)")
          echo "Scraped $COUNT models"
          if [ "$COUNT" -lt 500 ]; then
            echo "ERROR: Expected at least 500 models, got $COUNT. Aborting."
            exit 1
          fi
          node -e "const d=require('./$FILE'); if(!d.metadata||!d.metadata.scrapedAt){console.error('ERROR: Missing metadata');process.exit(1)}"
          echo "Data validation passed"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/motorcycles.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update motorcycle data ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Scraper Alert] Data scraping failed - ${date}`,
              body: [
                `## Scraper Failure Report`,
                ``,
                `- **Date**: ${date}`,
                `- **Workflow run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                `- **Trigger**: ${context.eventName}`,
                ``,
                `The scraper failed validation. Possible causes:`,
                `- Source website structure changed`,
                `- Network issues / rate limiting`,
                `- Data count below 500 threshold`,
                ``,
                `Please check the workflow logs and inspect the source website.`,
              ].join('\n'),
              labels: ['scraper-alert'],
            });

      - name: Send email notification on failure
        if: failure() && env.SMTP_HOST != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[MotoFuel] Scraper failed - ${{ github.event.repository.updated_at || 'unknown date' }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.SMTP_USER }}
          body: |
            MotoFuel scraper has failed.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger: ${{ github.event_name }}

            Please check the workflow logs for details.
