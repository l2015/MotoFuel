name: Scrape Motorcycle Data

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 11:00 CST (UTC+8)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        run: npm install
        working-directory: scraper

      - name: Run scraper
        run: node index.js
        working-directory: scraper

      - name: Validate scraped data
        run: |
          FILE="public/data/motorcycles.json"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: Data file not found"
            exit 1
          fi
          COUNT=$(node -e "const d=require('./$FILE'); console.log(d.data.length)")
          echo "Scraped $COUNT models"
          if [ "$COUNT" -lt 500 ]; then
            echo "ERROR: Expected at least 500 models, got $COUNT. Aborting."
            exit 1
          fi
          node -e "const d=require('./$FILE'); if(!d.metadata||!d.metadata.scrapedAt){console.error('ERROR: Missing metadata');process.exit(1)}"
          echo "Data validation passed"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/motorcycles.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update motorcycle data ($(date -u +%Y-%m-%d))"
            git push
          fi
